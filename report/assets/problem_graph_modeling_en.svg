<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Abstracting the Road Network into a Two-Level Directed Graph</title>
  <desc id="desc">Three-part diagram showing the physical road network, its transformation into a detailed road-network graph and a POI graph, and the assignment of context-dependent edge weights for directed search.</desc>

  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 5.5 L1 10 Z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 5.5 L1 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 5.5 L1 10 Z" fill="#059669"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1 1 L10 5.5 L1 10 Z" fill="#ea580c"/>
    </marker>
    <style>
      .title { font: 700 40px Inter, Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 20px Inter, Arial, sans-serif; fill: #64748b; }
      .panel-label { font: 700 15px Inter, Arial, sans-serif; letter-spacing: 1.5px; }
      .panel-title { font: 700 25px Inter, Arial, sans-serif; fill: #0f172a; }
      .heading { font: 700 19px Inter, Arial, sans-serif; fill: #0f172a; }
      .body { font: 400 16px Inter, Arial, sans-serif; fill: #475569; }
      .small { font: 400 14px Inter, Arial, sans-serif; fill: #64748b; }
      .metric { font: 700 17px Inter, Arial, sans-serif; fill: #4338ca; }
      .node-label { font: 700 16px Inter, Arial, sans-serif; fill: #ffffff; }
      .edge { fill: none; stroke: #64748b; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow); }
      .forward { fill: none; stroke: #2563eb; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow-blue); }
      .reverse { fill: none; stroke: #ea580c; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow-orange); }
      .flow { fill: none; stroke: #059669; stroke-width: 4; stroke-linecap: round; marker-end: url(#arrow-green); }
      .road { fill: none; stroke: #cbd5e1; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .road-center { fill: none; stroke: #ffffff; stroke-width: 2; stroke-dasharray: 12 10; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1600" height="950" fill="#f8fafc"/>
  <rect width="1600" height="13" fill="#0891b2"/>

  <text x="70" y="72" class="title">Abstracting the Road Network into a Two-Level Directed Graph</text>
  <text x="70" y="108" class="subtitle">From Physical Roads to the State Space, Context-Dependent Weights, and an Optimal Route</text>

  <!-- Panels -->
  <g filter="url(#shadow)">
    <rect x="45" y="145" width="465" height="700" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="567" y="145" width="466" height="700" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <rect x="1090" y="145" width="465" height="700" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>

  <!-- Panel headers -->
  <rect x="70" y="170" width="130" height="30" rx="15" fill="#e0f2fe"/>
  <text x="135" y="191" text-anchor="middle" class="panel-label" fill="#0369a1">01 · REAL WORLD</text>
  <text x="75" y="238" class="panel-title">Urban Road Network</text>
  <text x="75" y="268" class="body">Intersections, POIs, and Directed Movements</text>

  <rect x="592" y="170" width="170" height="30" rx="15" fill="#eef2ff"/>
  <text x="677" y="191" text-anchor="middle" class="panel-label" fill="#4338ca">02 · ABSTRACTION</text>
  <text x="597" y="238" class="panel-title">One Semantics, Two Resolutions</text>
  <text x="597" y="268" class="body">Direction and Corridor Provenance Preserved</text>

  <rect x="1115" y="170" width="160" height="30" rx="15" fill="#ecfdf5"/>
  <text x="1195" y="191" text-anchor="middle" class="panel-label" fill="#047857">03 · SEARCH</text>
  <text x="1120" y="238" class="panel-title">Context-Dependent Edge Weights</text>
  <text x="1120" y="268" class="body">Objective + Time Slot → Weighted Graph</text>

  <!-- Panel 1: stylized street network -->
  <path class="road" d="M105 370 C180 315 250 330 320 385 S430 470 465 415"/>
  <path class="road-center" d="M105 370 C180 315 250 330 320 385 S430 470 465 415"/>
  <path class="road" d="M145 655 C205 570 245 495 320 385 S405 260 445 305"/>
  <path class="road-center" d="M145 655 C205 570 245 495 320 385 S405 260 445 305"/>
  <path class="road" d="M90 520 C180 505 250 515 335 565 S420 650 470 620"/>
  <path class="road-center" d="M90 520 C180 505 250 515 335 565 S420 650 470 620"/>

  <path class="forward" d="M130 360 C190 325 250 340 300 375"/>
  <path class="reverse" d="M455 425 C410 462 370 440 335 405"/>
  <path class="forward" d="M160 635 C205 565 250 485 303 405"/>
  <path class="forward" d="M105 510 C180 500 250 515 315 550"/>

  <g>
    <circle cx="105" cy="370" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="320" cy="385" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="465" cy="415" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="145" cy="655" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="90" cy="520" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="335" cy="565" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="470" cy="620" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
    <circle cx="445" cy="305" r="10" fill="#ffffff" stroke="#475569" stroke-width="4"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="145" cy="655" r="27" fill="#2563eb"/>
    <circle cx="445" cy="305" r="27" fill="#ea580c"/>
  </g>
  <text x="145" y="661" text-anchor="middle" class="node-label">A</text>
  <text x="445" y="311" text-anchor="middle" class="node-label">B</text>

  <rect x="78" y="718" width="404" height="86" rx="18" fill="#f8fafc" stroke="#dbe4ee" stroke-width="2"/>
  <text x="98" y="749" class="heading">Directed Transition Relation</text>
  <text x="98" y="777" class="body">A → B is valid only when a directed edge sequence exists.</text>
  <text x="98" y="798" class="small">A reverse edge cannot be inferred from geographic proximity.</text>

  <!-- Panel 2: detailed corridor -->
  <text x="600" y="315" class="heading">Detailed Road-Network Graph G_real</text>
  <text x="600" y="344" class="metric">2,118 Nodes · 4,699 Edges</text>

  <path class="forward" d="M635 380 H715"/>
  <path class="forward" d="M745 380 H825"/>
  <path class="forward" d="M855 380 H935"/>
  <circle cx="620" cy="380" r="22" fill="#2563eb"/>
  <circle cx="730" cy="380" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="840" cy="380" r="15" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="950" cy="380" r="22" fill="#ea580c"/>
  <text x="620" y="386" text-anchor="middle" class="node-label">A</text>
  <text x="730" y="386" text-anchor="middle" class="small">x₁</text>
  <text x="840" y="386" text-anchor="middle" class="small">x₂</text>
  <text x="950" y="386" text-anchor="middle" class="node-label">B</text>
  <text x="785" y="424" text-anchor="middle" class="small">The A → B Corridor Contains 1–33 Contiguous Edges</text>

  <path class="reverse" d="M930 468 C845 510 750 510 650 468"/>
  <circle cx="790" cy="495" r="14" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="790" y="500" text-anchor="middle" class="small">y</text>
  <text x="785" y="535" text-anchor="middle" class="small">B → A May Follow a Different Corridor</text>

  <path class="flow" d="M800 555 V610"/>
  <rect x="602" y="615" width="396" height="170" rx="22" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="620" y="653" class="heading" style="font-size:18px">POI Graph G_demo</text>
  <text x="980" y="653" text-anchor="end" class="metric" style="font-size:15px">51 Nodes · 298 Edges</text>
  <circle cx="675" cy="713" r="25" fill="#2563eb"/>
  <circle cx="925" cy="713" r="25" fill="#ea580c"/>
  <text x="675" y="719" text-anchor="middle" class="node-label">A</text>
  <text x="925" y="719" text-anchor="middle" class="node-label">B</text>
  <path class="forward" d="M705 698 C770 660 835 660 895 698"/>
  <path class="reverse" d="M895 730 C835 765 770 765 705 730"/>
  <text x="800" y="682" text-anchor="middle" class="small">POI Edge A → B</text>
  <text x="800" y="764" text-anchor="middle" class="small">POI Edge B → A</text>

  <!-- Panel 3: contextual weights -->
  <rect x="1120" y="305" width="405" height="120" rx="20" fill="#f8fafc" stroke="#dbe4ee" stroke-width="2"/>
  <text x="1145" y="342" class="heading">Edge-Attribute Vector e = (u, v)</text>
  <text x="1145" y="375" class="body">length · free-flow speed</text>
  <text x="1145" y="403" class="body">congestion at h · risk indicators</text>

  <path class="flow" d="M1322 430 V480"/>

  <rect x="1120" y="485" width="405" height="175" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1145" y="522" class="heading">Three Edge-Weight Functions</text>
  <rect x="1145" y="545" width="108" height="32" rx="16" fill="#dbeafe"/>
  <rect x="1260" y="545" width="90" height="32" rx="16" fill="#dcfce7"/>
  <rect x="1357" y="545" width="130" height="32" rx="16" fill="#ffedd5"/>
  <text x="1199" y="567" text-anchor="middle" class="small" fill="#1d4ed8">distance · m</text>
  <text x="1305" y="567" text-anchor="middle" class="small" fill="#047857">time · s</text>
  <text x="1422" y="567" text-anchor="middle" class="small" fill="#c2410c">balanced · s</text>
  <text x="1145" y="610" class="body">w(e, h, mode) is evaluated at routing time</text>
  <text x="1145" y="638" class="small">h ∈ {07:30, 12:00, 17:30, 22:00}</text>

  <path class="flow" d="M1322 665 V710"/>

  <rect x="1120" y="715" width="405" height="90" rx="20" fill="#0f172a"/>
  <text x="1145" y="750" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#ffffff">Weighted Search Space</text>
  <text x="1145" y="781" font-family="Inter,Arial,sans-serif" font-size="16" fill="#cbd5e1">start → transitions → goal → route P*</text>

  <!-- Footer claim -->
  <rect x="430" y="875" width="740" height="48" rx="24" fill="#ffffff" stroke="#4f46e5" stroke-width="2"/>
  <text x="800" y="906" text-anchor="middle" class="heading" fill="#4338ca">Asymmetry Is Preserved: C(A, B) ≠ C(B, A)</text>
</svg>
